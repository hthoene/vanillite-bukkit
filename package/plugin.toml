# The package description Vanillite reads before it loads the library.
id = "bukkit"
name = "Bukkit layer"
version = "0.1.2"
# Plugin API (ABI) version the library needs.
api = "1.10"
# Base name of the library: libvanillite_jvm.so
library = "vanillite_jvm"
# Bukkit plugins expect one main thread: every call into the layer is serialized.
threading = "serialized"
