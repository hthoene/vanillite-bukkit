# Release of the layer: a tag v<version> (the version of package/plugin.toml and Cargo.toml)
# builds the archive vanillite-bukkit-<version>-<target>.tar.gz for each target Vanillite ships
# (Linux, Windows, macOS) and publishes them with SHA256SUMS as a GitHub release. Vanillite pins a
# release with these hashes (crates/vanillite-server/bukkit-layer.txt) and downloads it when
# plugins/ holds Paper or Spigot plugins. A manual run is a dry run: the archives become workflow
# artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The native library, on a runner of each target. The Java parts are the same everywhere and
  # are built once by `package`.
  library:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): the library must load next to Vanillite's glibc build
          # (vanillite-gnu, glibc 2.28) on Debian bookworm (2.36) in the Docker image.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, library: libvanillite_jvm.so }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, library: libvanillite_jvm.so }
          # The C runtime linked in, like vanillite.exe: no Visual C++ redistributable needed.
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, library: vanillite_jvm.dll, rustflags: "-C target-feature=+crt-static" }
          - { runner: macos-latest, target: aarch64-apple-darwin, library: libvanillite_jvm.dylib }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, library: libvanillite_jvm.dylib }
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p vanillite-jvm --lib
      # The build records its target; the host refuses a library of another target.
      - shell: bash
        run: test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.target }}
          path: target/release/${{ matrix.library }}
          if-no-files-found: error

  package:
    needs: library
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vanillite-bukkit
          key: libraries-${{ hashFiles('bukkit/resources/libraries.txt', 'compat/*/libraries.txt') }}
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' package/plugin.toml)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME" && test "$cargo_version" = "$version" \
            || { echo "tag $GITHUB_REF_NAME, plugin.toml $version, Cargo.toml $cargo_version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: libraries
      - name: Package
        run: |
          scripts/build.sh
          for dir in libraries/library-*; do
            target="${dir#libraries/library-}"
            scripts/package.sh "$target" "$(ls "$dir"/*)"
          done
          ls -l build/release
      - uses: actions/upload-artifact@v4
        with:
          name: layer
          path: build/release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "vanillite-bukkit ${GITHUB_REF_NAME#v}" *.tar.gz SHA256SUMS
